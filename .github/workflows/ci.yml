# Architecture-specific hardened CI workflow for TotalDrop for Linux (04-linux):
# native x86_64 and ARM64 pure-Rust + Qt 6 Wayland desktop verification,
# RISC-V 64 (riscv64gc-unknown-linux-gnu) cross-compilation verification,
# packaging & version synchronization checks, cargo-deny, REUSE 3.3, and gitleaks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  rust-and-packaging:
    name: Rust & Packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c clippy,rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (workspace crates)
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Workspace crate tests
        env:
          RUSTFLAGS: -D warnings
          TOTALDROP_REQUIRE_IPV6: "1"
        run: cargo test --locked
      - name: Standalone Wayland desktop helper unit tests
        run: |
          rustc --edition 2024 --test ui-qt6-wayland/src/desktop.rs -o "$RUNNER_TEMP/td_linux_desktop_test"
          "$RUNNER_TEMP/td_linux_desktop_test"
      - name: Version and toolchain synchronization check
        run: bash packaging-common/check-versions.sh
      - name: Packaging verifier self-tests (bash and dash)
        run: |
          bash packaging-common/test-check-versions.sh
          bash packaging-common/test-check-cli-version.sh
          bash packaging-common/test-check-package-contents.sh
          dash packaging-common/test-check-versions.sh
          dash packaging-common/test-check-cli-version.sh
          dash packaging-common/test-check-package-contents.sh
      - name: Nautilus extension tests
        run: python3 -I packaging-common/linux/file-managers/test_totaldrop_nautilus.py
      - name: Verify 16 isolated sub-platform x CPU units
        run: python3 tools/verify-subplatforms.py
      - name: Verify Linux desktop metadata, Kose SVGs & 16 Node 24 packaging workflows
        run: python3 tools/verify-linux-desktop-assets.py

  qt6-wayland-desktop:
    name: Qt 6 Wayland Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    # Debian 13 (Qt 6.8) multi-arch digest shared with packaging-common/containers/debian.Dockerfile:
    # totaldrop-linux targets Qt 6.8+, whereas Ubuntu 24.04 host apt ships Qt 6.4.
    container: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - name: Install Qt 6 development packages, QML modules, and D-Bus
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential lld pkgconf ca-certificates curl git dbus \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qttest qt6-svg-plugins qt6-wayland
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        env:
          RUSTUP_VERSION: "1.29.3"
          RUSTUP_SHA256_X86_64: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
          RUSTUP_SHA256_AARCH64: 9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) sum=$RUSTUP_SHA256_X86_64 ;;
            aarch64) sum=$RUSTUP_SHA256_AARCH64 ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          curl -sSfo /tmp/rustup-init "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$arch-unknown-linux-gnu/rustup-init"
          echo "$sum  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.99.1 -c clippy,rustfmt
          rm /tmp/rustup-init
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - name: Clippy (totaldrop-linux)
        env:
          QMAKE: /usr/lib/qt6/bin/qmake
          CXX_QT_AUTORCC_OPTIONS: --format-version:1:--no-zstd
        run: cargo clippy -p totaldrop-linux --all-targets --locked -- -D warnings
      - name: Test (totaldrop-linux)
        env:
          QMAKE: /usr/lib/qt6/bin/qmake
          CXX_QT_AUTORCC_OPTIONS: --format-version:1:--no-zstd
        run: cargo test -p totaldrop-linux --locked
      - name: Headless QML UI tests
        run: sh ui-qt6-wayland/tests/qml/run.sh

  riscv64-check:
    name: RISC-V 64 Cross-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install RISC-V GNU cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libc6-dev-riscv64-cross
      - name: Install the pinned Rust toolchain and riscv64gc target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" riscv64gc-unknown-linux-gnu
      - name: Check crates for riscv64gc-unknown-linux-gnu
        run: >-
          cargo --config target-riscv64/cargo-config.toml check
          --target riscv64gc-unknown-linux-gnu --locked
          -p totaldrop-crypto -p totaldrop-proto -p totaldrop-core -p totaldrop-l10n -p totaldrop-cli

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"

  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source files carry SPDX lines
        run: ./tools/check-spdx.sh
      - name: reuse lint
        run: >-
          docker run --rm --volume "$PWD:/data"
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
          lint

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            merge_group) base=$MERGE_GROUP_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range=$base..HEAD
          else
            base=HEAD range=HEAD
          fi
          echo "Scanning $range"
          { echo "BASE=$base"; echo "RANGE=$range"; } >>"$GITHUB_ENV"
      - name: No signing keys, key.properties or .gitleaksignore
        run: |
          found=$(
            { git ls-files -z
              git -c core.quotePath=false log --format= --name-only -z --no-renames --diff-filter=d "$RANGE"
            } | grep -ziE '(^|/)(key\.properties|\.gitleaksignore)$|\.(jks|keystore|p12|pfx|pepk)$' | tr '\0' '\n' | sort -u
          )
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Signing keys, key.properties and .gitleaksignore must not be committed."
            exit 1
          fi
      - name: gitleaks
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        run: |
          cfg=$RUNNER_TEMP/gitleaks
          mkdir -p "$cfg"
          if ! git show "$BASE:.gitleaks.toml" >"$cfg/gitleaks.toml" 2>/dev/null; then
            printf '[extend]\nuseDefault = true\n' >"$cfg/gitleaks.toml"
          fi
          docker run --rm --volume "$PWD/.git:/repo/.git:ro" --volume "$cfg:/cfg:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose --config /cfg/gitleaks.toml \
            --gitleaks-ignore-path /cfg --ignore-gitleaks-allow \
            --log-opts="--text $RANGE" /repo

  gate:
    name: CI
    if: always()
    needs: [rust-and-packaging, qt6-wayland-desktop, riscv64-check, deny, reuse, secrets]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
